<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Cyberpunk</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/augmented-ui@2/augmented-ui.min.css">
    
    <!-- Cyberpunk CSS Framework -->
    <link rel="stylesheet" href="styles/cyberpunk/cyberpunk.css">
    <link rel="stylesheet" href="styles/cyberpunk/cyber-grid.css">
    <link rel="stylesheet" href="styles/cyberpunk/cyberpunk-integrated.css">
    <script src="styles/cyberpunk/helper.js"></script>
    
    <link rel="stylesheet" href="styles/layout/header.css">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/components/triangle-anim.css">
    <link rel="stylesheet" href="styles/pages/contacts.css">
</head>
<body class="page-contacts">
    <!-- Sticky Navigation -->
    <nav class="cyber-razor-bottom-fixed">
        <div class="logo">
            <div class="cyberpunk-font-og fg-white">CYBERPUNK</div>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="map.html">MAP</a></li>
            <li><a href="news.html">HEADLINES</a></li>
            <li><a href="contacts.html">CONTACT</a></li>
        </ul>
    </nav>
    
    <!-- Mobile Menu Overlay -->
    <div class="menu-overlay"></div>

    <!-- Particles background (black page, particles visible on load) -->
    <div id="tsparticles" class="particles-layer" aria-hidden="true"></div>

    <!-- Glass contact box: fixed center, mobile-fit, desktop square ~33% -->
    <main class="contacts-content">
        <!-- Add class "cyber-glitch-2" when your single variable is set to trigger glitch (see contacts.css) -->
        <div id="contactGlassBox" class="contact-glass-box" data-augmented-ui="tl-clip tr-clip bl-clip br-clip border">
            <p class="contact-glass-greeting">Корпорация ОКО приветствует вас! Оставьте свои данные и мы с вами свяжемся</p>
            <form class="contact-glass-form" action="#" method="post">
                <input type="text" class="contact-glass-input" name="contact_data" placeholder="Ваши данные" required autocomplete="off">
                <button type="submit" class="contact-glass-btn">Send!</button>
            </form>
        </div>
    </main>

    <!--  <script src="https://cdn.jsdelivr.net/npm/tsparticles@1.49.0/tsparticles.min.js"></script> -->

    <!--  <script src="https://cdn.jsdelivr.net/npm/tsparticles@1.18.0/dist/tsparticles.min.js"></script>  -->

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@1.18.0/dist/tsparticles.min.js"></script>
    <script src="scripts/components/particles-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var id = 'tsparticles';
            var config = window.particlesConfig;
            if (!window.tsParticles || !config) return;
            /* Optional 1-frame delay so container has layout; remove rAF wrapper to compare */
            requestAnimationFrame(function() {
                window.tsParticles.load(id, config);
            });
        });
    </script>
    <script src="scripts/components/mobile-menu.js"></script>
    <script>
        document.querySelector('.contact-glass-form')?.addEventListener('submit', function(e) {
            e.preventDefault();
            /* TODO: send data (e.g. fetch or form action) */
        });
    </script>
</body>
</html>
